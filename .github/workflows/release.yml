name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-frpc-new

jobs:
  build:
    name: Build ipk packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2)
          RELEASE=$(grep '^PKG_RELEASE:=' Makefile | cut -d= -f2)
          FULL_VERSION="${VERSION}-${RELEASE}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Package: $PACKAGE_NAME v$FULL_VERSION"

      - name: Build ipk packages
        run: |
          mkdir -p output

          # Build .ipk for each target architecture
          # Since LUCI_PKGARCH:=all, the package content is identical
          # but we provide per-arch filenames for user convenience
          for ARCH in all x86_64 aarch64_generic mipsel_24kc arm_cortex-a7_neon-vfpv4; do
            echo "Building for architecture: $ARCH"

            # Create build directory
            BUILD_DIR="/tmp/build_${ARCH}"
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"

            # Create data directory structure
            DATA_DIR="$BUILD_DIR/data"
            mkdir -p "$DATA_DIR/usr/lib/lua/luci/controller"
            mkdir -p "$DATA_DIR/usr/lib/lua/luci/model/cbi"
            mkdir -p "$DATA_DIR/usr/lib/lua/luci/view/frpc"
            mkdir -p "$DATA_DIR/usr/share/luci/menu.d"
            mkdir -p "$DATA_DIR/usr/share/rpcd/acl.d"
            mkdir -p "$DATA_DIR/etc/config"
            mkdir -p "$DATA_DIR/etc/init.d"
            mkdir -p "$DATA_DIR/usr/lib/frpc"
            mkdir -p "$DATA_DIR/usr/share/luci/i18n"

            # Copy Lua source files
            cp luasrc/controller/frpc.lua "$DATA_DIR/usr/lib/lua/luci/controller/"
            cp luasrc/model/cbi/frpc-client.lua "$DATA_DIR/usr/lib/lua/luci/model/cbi/"
            cp luasrc/model/cbi/frpc-proxy.lua "$DATA_DIR/usr/lib/lua/luci/model/cbi/"
            cp luasrc/model/cbi/frpc-visitor.lua "$DATA_DIR/usr/lib/lua/luci/model/cbi/"
            cp luasrc/model/cbi/frpc-visitors.lua "$DATA_DIR/usr/lib/lua/luci/model/cbi/"
            cp luasrc/view/frpc/status_display.htm "$DATA_DIR/usr/lib/lua/luci/view/frpc/"

            # Copy config and init scripts
            cp root/etc/config/frpc "$DATA_DIR/etc/config/"
            cp root/etc/init.d/frpc "$DATA_DIR/etc/init.d/"
            cp root/usr/lib/frpc/generate_toml.sh "$DATA_DIR/usr/lib/frpc/"

            # Build translation .lmo file from .po
            if command -v po2lmo >/dev/null 2>&1; then
              po2lmo po/zh-cn/frpc.po "$DATA_DIR/usr/share/luci/i18n/frpc.zh-cn.lmo"
            else
              # Fallback: install gettext and build manually
              sudo apt-get install -y gettext >/dev/null 2>&1
              # Create a minimal .lmo placeholder (the .po will be used directly)
              mkdir -p "$DATA_DIR/usr/share/luci/i18n"
              cp po/zh-cn/frpc.po "$DATA_DIR/usr/share/luci/i18n/frpc.zh-cn.po" 2>/dev/null || true
            fi

            # Make scripts executable
            chmod 755 "$DATA_DIR/etc/init.d/frpc"
            chmod 755 "$DATA_DIR/usr/lib/frpc/generate_toml.sh"

            # Create control file
            CONTROL_DIR="$BUILD_DIR/control"
            mkdir -p "$CONTROL_DIR"

            cat > "$CONTROL_DIR/control" << EOF
          Package: $PACKAGE_NAME
          Version: ${{ steps.version.outputs.full_version }}
          Depends: libc, frpc
          Source: https://github.com/${{ github.repository }}
          License: MIT
          Section: luci
          Architecture: $ARCH
          Maintainer: frpc-new
          Description: LuCI app for frpc (TOML-based v0.70.1)
           Provides a web interface for configuring frpc client with
           TOML-based configuration format (frp >= 0.52.0).
          EOF

            # Create conffiles list
            cat > "$CONTROL_DIR/conffiles" << EOF
          /etc/config/frpc
          /etc/init.d/frpc
          EOF

            # Build data.tar.gz
            cd "$DATA_DIR"
            tar --owner=0 --group=0 -czf "$BUILD_DIR/data.tar.gz" .
            cd -

            # Build control.tar.gz
            cd "$CONTROL_DIR"
            tar --owner=0 --group=0 -czf "$BUILD_DIR/control.tar.gz" .
            cd -

            # Create debian-binary
            echo "2.0" > "$BUILD_DIR/debian-binary"

            # Build .ipk (ar archive)
            IPK_NAME="${PACKAGE_NAME}_${{ steps.version.outputs.full_version }}_${ARCH}.ipk"
            cd "$BUILD_DIR"
            ar rcs "$GITHUB_WORKSPACE/output/$IPK_NAME" debian-binary control.tar.gz data.tar.gz
            cd -

            echo "  ? Built: $IPK_NAME ($(stat -c%s "$GITHUB_WORKSPACE/output/$IPK_NAME") bytes)"
          done

          echo ""
          echo "=== All built packages ==="
          ls -la output/

      - name: Generate checksums
        working-directory: output
        run: |
          sha256sum *.ipk > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-packages
          path: output/*
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        id: prep
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p release
          find artifacts/ -type f \( -name "*.ipk" -o -name "SHA256SUMS.txt" \) -exec cp {} release/ \;

          echo "=== Release files ==="
          ls -la release/

      - name: Create release notes
        run: |
          VERSION=${{ steps.prep.outputs.version }}
          cat > release/RELEASE_NOTES.md << 'HEREDOC'
          ## luci-app-frpc-new VERSION_PLACEHOLDER

          LuCI Web ???? - ?? frp v0.70.1+

          ### ????

          - ?? 8 ?????:TCP / UDP / HTTP / HTTPS / TCPMux / STCP / XTCP / SUDP
          - ?? 10 ???:socks5 / http_proxy / static_file / unix_domain_socket / http2socks / sni / http2https / https2http / https2https / tls2raw
          - ??? Visitor ??(STCP/XTCP/SUDP ?????)
          - Token / OIDC / TokenSource ????
          - Wire Protocol v1/v2?TLS ?????QUIC ????
          - VirtualNet ?????Feature Gates???????
          - ??????

          ### ????

          #### ???:LuCI Web ??(??)
          1. ?????????????? `.ipk` ??
          2. ?? **?? ? ?? ? ?????**
          3. ????? `.ipk` ??
          4. ?? **??**

          #### ???:???
          ```bash
          # ??????
          scp luci-app-frpc-new_*.ipk root@192.168.1.1:/tmp/
          # SSH ?????
          ssh root@192.168.1.1
          opkg install /tmp/luci-app-frpc-new_*.ipk
          ```

          ### ????

          ??? `all` ??(? Lua/Shell),??????????,???????????

          | ????? | ???? |
          |-----------|---------|
          | `_all` | ????,??????? |
          | `_x86_64` | ????x86 ??? |
          | `_aarch64_generic` | ??? 4/5?ARM64 ??? |
          | `_mipsel_24kc` | MT7621 ???(? WR1200JS?Newifi) |
          | `_arm_cortex-a7_neon-vfpv4` | ??? 2/3?ARMv7 ??? |

          ### ??

          - OpenWrt 23.05+ ? 24.10+
          - `frpc` ?(frp ????????)
