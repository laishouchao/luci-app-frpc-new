          https://github.com/laishouchao/luci-app-frpc-new
          HEREDOC

          # Replace version placeholder
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" release/RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "luci-app-frpc-new ${{ steps.prep.outputs.version }}"
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.ipk
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
